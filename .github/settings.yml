# These settings are synced to GitHub by https://probot.github.io/apps/settings/
---
_extends: .github:.github/settings.yml

repository:
  name: azkena
  description: The Pilotariak MCP server
  homepage: https://github.com/Pilotariak/azkena
  topics: pilotariak, azkena, mcp, agents, skills

# Labels: define labels for Issues and Pull Requests
labels:

  ## CLOUD PROVIDERS
  #
  - name: "cloud/cloudflare"
    description: "Cloudflare provider"
    color: "068082"

  ## AREA

  - name: "area/graphql"
    description: "GraphQL"
    color: "cc317c"

  - name: "area/agents"
    description: "Agents"
    color: "cc317c"

  - name: "area/docker"
    description: "Docker"
    color: "cc317c"

  ## DEPENDENCY

  - name: "dependency/typescript"
    description: "Dependency Typescript"
    color: "6fcb70"

  - name: "dependency/docker"
    description: "Dependency Docker"
    color: "6fcb70"

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 1
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
      required_status_checks:
        strict: true
        contexts:
          - Typecheck
          - Validate GraphQL Schema
          - Analyze (typescript)
      enforce_admins: true
      restrictions: null
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
